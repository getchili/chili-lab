<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#2E1714"/>
      <stop offset="1" stop-color="#120B0A"/>
    </radialGradient>
    <linearGradient id="pepper" x1="0.75" y1="0.1" x2="0.15" y2="0.95">
      <stop offset="0" stop-color="#FF6B4A"/>
      <stop offset="0.55" stop-color="#E5302A"/>
      <stop offset="1" stop-color="#A3161B"/>
    </linearGradient>
    <linearGradient id="stem" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7BE07F"/>
      <stop offset="1" stop-color="#2E9E44"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <!-- Fond -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Pistes de circuit imprimé, discrètes -->
  <g fill="none" stroke="#FF6B4A" stroke-opacity="0.13" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M40 150h70l30 30v90"/>
    <path d="M40 330h50l40-40"/>
    <path d="M472 120h-60l-30 30"/>
    <path d="M472 360h-80l-36 36v76"/>
    <path d="M190 472v-40l24-24"/>
  </g>
  <g fill="#FF6B4A" fill-opacity="0.18">
    <circle cx="140" cy="270" r="10"/>
    <circle cx="130" cy="290" r="10"/>
    <circle cx="382" cy="150" r="10"/>
    <circle cx="214" cy="408" r="10"/>
  </g>

  <!-- Halo -->
  <path transform="translate(74 54) scale(13)" filter="url(#glow)" opacity="0.55" fill="#FF3B2F"
        d="M15 11.5c3-1.3 7.5-.6 8.5 2.5 1.2 3.8-1.6 8.6-6.4 11.8C12.8 28.6 7.2 29.6 4 28.5c-.9-.3-.8-1.3.1-1.6 4.4-1.4 7.6-4.3 9-8.3.9-2.6.2-5.6 1.9-7.1z"/>

  <g transform="translate(74 54) scale(13)">
    <!-- Queue : une piste qui finit sur une pastille de soudure -->
    <path d="M19 9.5c0-3 1.5-5 4-6" fill="none" stroke="url(#stem)" stroke-width="1.9" stroke-linecap="round"/>
    <circle cx="23.4" cy="3.3" r="1.35" fill="#120B0A" stroke="#7BE07F" stroke-width="0.8"/>
    <!-- Calice -->
    <path d="M14.3 10.6c1.6-2.4 7-3 9.6 0-1.7 1.3-3.4 1.7-4.8 1.7-1.9 0-3.5-.6-4.8-1.7z" fill="url(#stem)"/>
    <!-- Piment -->
    <path d="M15 11.5c3-1.3 7.5-.6 8.5 2.5 1.2 3.8-1.6 8.6-6.4 11.8C12.8 28.6 7.2 29.6 4 28.5c-.9-.3-.8-1.3.1-1.6 4.4-1.4 7.6-4.3 9-8.3.9-2.6.2-5.6 1.9-7.1z" fill="url(#pepper)"/>
    <!-- Reflets -->
    <path d="M17.3 14c-.7 3.6-2.5 7.2-5.8 9.8" fill="none" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="1.1" stroke-linecap="round"/>
    <path d="M20.6 13.6c.3.5.5 1 .5 1.6" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="0.8" stroke-linecap="round"/>
  </g>
</svg>
